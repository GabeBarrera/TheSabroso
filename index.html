<body>
  <!-- SVG filter definitions (hidden) -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <defs>
      <!-- Two strokes with different seeds so they take independent paths and cross each other -->
      <filter id="scribble-a" x="-2%" y="-500%" width="104%" height="1100%">
        <feTurbulence type="turbulence" baseFrequency="0.02 0.9" numOctaves="4" seed="3" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G" result="displaced"/>
        <feGaussianBlur in="displaced" stdDeviation="0.35"/>
      </filter>
      <filter id="scribble-b" x="-2%" y="-500%" width="104%" height="1100%">
        <feTurbulence type="turbulence" baseFrequency="0.022 0.85" numOctaves="4" seed="11" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G" result="displaced"/>
        <feGaussianBlur in="displaced" stdDeviation="0.35"/>
      </filter>
    </defs>
  </svg>
  <div id="root"></div>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
