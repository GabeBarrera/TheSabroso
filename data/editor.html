<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sabroso · Data Editor</title>
<link rel="icon" type="image/png" href="../src/img/favicon.png" />
<link rel="apple-touch-icon" href="../src/img/apple-touch-icon.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,800;0,900;1,400;1,700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<!-- Main app component styles (modals, forms, buttons, rich editor, etc.) -->
<link rel="stylesheet" href="../src/styles/styles.css" />

<style>
  /* Override main app's fixed-height viewport shell so editor can scroll */
  html, body, #root {
    height: auto !important;
    min-height: 100vh;
    overflow: auto !important;
  }

  /* ── Editor chrome ── */
  .ed-header {
    background: var(--ink);
    color: var(--paper);
    padding: 0 24px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 500;
  }
  .ed-wordmark {
    font-family: var(--serif);
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -.01em;
  }
  .ed-wordmark span { font-style: italic; font-weight: 400; color: var(--terracotta); }
  .ed-header-right { display: flex; gap: 8px; align-items: center; }
  .ed-header-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 13px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .18em;
    text-transform: uppercase;
    border: 1px solid rgba(255,255,255,.22);
    background: transparent;
    color: var(--paper);
    cursor: pointer;
    white-space: nowrap;
    transition: background 140ms ease, border-color 140ms ease;
  }
  .ed-header-btn:hover { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.4); }

  /* ── Tabs ── */
  .ed-tabs {
    display: flex;
    border-bottom: 1px solid var(--hairline);
    background: var(--cream-2);
    padding: 0 24px;
    position: sticky;
    top: 52px;
    z-index: 490;
  }
  .ed-tab {
    padding: 14px 20px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .22em;
    text-transform: uppercase;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--muted);
    cursor: pointer;
    margin-bottom: -1px;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: color 120ms ease;
  }
  .ed-tab.active { border-bottom-color: var(--terracotta); color: var(--ink); }
  .ed-tab:hover:not(.active) { color: var(--ink); }
  .ed-count {
    background: var(--hairline);
    color: var(--muted);
    font-family: var(--mono);
    font-size: 9px;
    padding: 1px 7px;
    border-radius: 10px;
    transition: background 120ms ease, color 120ms ease;
  }
  .ed-tab.active .ed-count { background: var(--terracotta); color: var(--paper); }

  /* ── Panel ── */
  .ed-panel { padding: 28px; max-width: 1100px; }
  .ed-panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    gap: 12px;
  }
  .ed-panel-title {
    font-family: var(--serif);
    font-size: 22px;
    font-weight: 700;
  }
  .ed-panel-actions { display: flex; gap: 8px; flex-shrink: 0; }

  /* ── Notice ── */
  .ed-notice {
    padding: 10px 16px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .12em;
    border-left: 3px solid var(--terracotta);
    background: var(--cream-2);
    color: var(--muted);
    margin-bottom: 20px;
  }
  .ed-notice code { font-family: var(--mono); color: var(--terracotta); }
  .ed-notice strong { color: var(--ink); }

  /* ── Entry list ── */
  .ed-list { display: flex; flex-direction: column; gap: 1px; }
  .ed-row {
    background: var(--paper);
    border: 1px solid var(--hairline);
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 16px;
    transition: border-color 140ms ease;
  }
  .ed-row:hover { border-color: var(--ink); }
  .ed-row-info { flex: 1; min-width: 0; }
  .ed-row-name {
    font-family: var(--serif);
    font-size: 16px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .ed-row-meta {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .12em;
    color: var(--muted);
    margin-top: 3px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .ed-rating {
    font-family: var(--serif);
    font-size: 15px;
    font-weight: 700;
    color: var(--terracotta);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .ed-pip {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 14px;
    height: 14px;
    font-size: 8px;
    font-weight: 700;
    font-family: var(--mono);
    color: #fff;
    flex-shrink: 0;
  }
  .ed-pip-r { background: var(--terracotta); }
  .ed-pip-b { background: var(--marine); }

  /* ── Small button variant for editor UI ── */
  .btn-sm {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .18em;
    text-transform: uppercase;
    border: 1px solid var(--ink);
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
    white-space: nowrap;
    transition: background 140ms ease, color 140ms ease;
  }
  .btn-sm:hover { background: var(--ink); color: var(--paper); }
  .btn-sm.ghost { border-color: var(--hairline); color: var(--muted); }
  .btn-sm.ghost:hover { background: var(--cream); color: var(--ink); border-color: var(--ink); }
  .btn-sm.accent { background: var(--terracotta); border-color: var(--terracotta); color: var(--paper); }
  .btn-sm.accent:hover { background: var(--terracotta-2); border-color: var(--terracotta-2); }

  /* ── Empty / loading states ── */
  .ed-empty, .ed-loading {
    padding: 48px;
    text-align: center;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--muted);
  }
</style>
</head>
<body>
<div id="root"></div>

<!-- React + Babel (same versions as main app) -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Shared app scripts (paths relative to data/) -->
<script src="../src/scripts/storage.js"></script>
<script type="text/babel" src="../src/scripts/components.js"></script>
<script type="text/babel" src="../src/scripts/forms.js"></script>

<script type="text/babel">
/* global React, ReactDOM, SDStore, RestaurantForm, RecipeForm, ToastProvider, useToast */
const { useState, useEffect } = React;

const R_KEY   = "sabroso_restaurants";
const REC_KEY = "sabroso_recipes";

/* ── Root app ── */
function EditorApp() {
  const [tab, setTab]           = useState("restaurants");
  const [restaurants, setRests] = useState([]);
  const [recipes, setRecs]      = useState([]);
  const [modal, setModal]       = useState(null); // null | { kind, entry? }
  const [loading, setLoading]   = useState(true);
  const toast = useToast();

  useEffect(() => { loadData(); }, []);

  async function loadData() {
    setLoading(true);
    let rOk = false, recOk = false;

    try {
      const res = await fetch("./restaurants.json?_=" + Date.now());
      if (!res.ok) throw new Error(res.status);
      const data = await res.json();
      setRests(data);
      localStorage.setItem(R_KEY, JSON.stringify(data));
      rOk = true;
    } catch {
      const cached = localStorage.getItem(R_KEY);
      if (cached) { setRests(JSON.parse(cached)); rOk = true; }
    }

    try {
      const res = await fetch("./recipes.json?_=" + Date.now());
      if (!res.ok) throw new Error(res.status);
      const data = await res.json();
      setRecs(data);
      localStorage.setItem(REC_KEY, JSON.stringify(data));
      recOk = true;
    } catch {
      const cached = localStorage.getItem(REC_KEY);
      if (cached) { setRecs(JSON.parse(cached)); recOk = true; }
    }

    setLoading(false);
    if (rOk && recOk)     toast("Loaded from JSON files", "ok");
    else if (!rOk && !recOk) toast("Fetch failed — serve via HTTP, not file://", "warn");
    else                  toast("Partially loaded — one file fell back to cache", "warn");
  }

  /* ── Restaurant CRUD ── */
  function saveRestaurant(entry) {
    setRests(prev => {
      const next = prev.find(r => r.id === entry.id)
        ? prev.map(r => r.id === entry.id ? entry : r)
        : [...prev, entry];
      localStorage.setItem(R_KEY, JSON.stringify(next));
      return next;
    });
    toast((modal?.entry ? "Updated" : "Added") + " · " + entry.name, "ok");
    setModal(null);
  }

  function deleteRestaurant(entry) {
    if (!confirm(`Delete "${entry.name}"? This cannot be undone.`)) return;
    setRests(prev => {
      const next = prev.filter(r => r.id !== entry.id);
      localStorage.setItem(R_KEY, JSON.stringify(next));
      return next;
    });
    toast("Deleted · " + entry.name);
    setModal(null);
  }

  /* ── Recipe CRUD ── */
  function saveRecipe(entry) {
    setRecs(prev => {
      const next = prev.find(r => r.id === entry.id)
        ? prev.map(r => r.id === entry.id ? entry : r)
        : [...prev, entry];
      localStorage.setItem(REC_KEY, JSON.stringify(next));
      return next;
    });
    toast((modal?.entry ? "Updated" : "Added") + " · " + entry.name, "ok");
    setModal(null);
  }

  function deleteRecipe(entry) {
    if (!confirm(`Delete "${entry.name}"? This cannot be undone.`)) return;
    setRecs(prev => {
      const next = prev.filter(r => r.id !== entry.id);
      localStorage.setItem(REC_KEY, JSON.stringify(next));
      return next;
    });
    toast("Deleted · " + entry.name);
    setModal(null);
  }

  /* ── Export ── */
  function exportJSON(kind) {
    const list = kind === "restaurant" ? restaurants : recipes;
    const filename = kind === "restaurant" ? "restaurants.json" : "recipes.json";
    SDStore.download(filename, JSON.stringify(list, null, 2));
    toast("Exported " + filename, "ok");
  }

  return (
    <>
      {/* ── Header ── */}
      <header className="ed-header">
        <div className="ed-wordmark">The <span>Sabroso</span> · Data Editor</div>
        <div className="ed-header-right">
          <button className="ed-header-btn" onClick={loadData}>↺ Reload JSON</button>
          <button className="ed-header-btn" onClick={() => { exportJSON("restaurant"); exportJSON("recipe"); }}>
            Export All
          </button>
        </div>
      </header>

      {/* ── Tabs ── */}
      <nav className="ed-tabs">
        <button className={`ed-tab${tab === "restaurants" ? " active" : ""}`} onClick={() => setTab("restaurants")}>
          Restaurants <span className="ed-count">{restaurants.length}</span>
        </button>
        <button className={`ed-tab${tab === "recipes" ? " active" : ""}`} onClick={() => setTab("recipes")}>
          Recipes <span className="ed-count">{recipes.length}</span>
        </button>
      </nav>

      {/* ── Panels ── */}
      {loading ? (
        <div className="ed-loading">Loading…</div>
      ) : (
        <div className="ed-panel">
          {tab === "restaurants" && (
            <RestaurantPanel
              restaurants={restaurants}
              onNew={() => setModal({ kind: "restaurant" })}
              onEdit={(r) => setModal({ kind: "restaurant", entry: r })}
              onExport={() => exportJSON("restaurant")}
            />
          )}
          {tab === "recipes" && (
            <RecipePanel
              recipes={recipes}
              onNew={() => setModal({ kind: "recipe" })}
              onEdit={(r) => setModal({ kind: "recipe", entry: r })}
              onExport={() => exportJSON("recipe")}
            />
          )}
        </div>
      )}

      {/* ── Modals — same forms as the main app's Manage button ── */}
      {modal?.kind === "restaurant" && (
        <RestaurantForm
          initial={modal.entry}
          mode={modal.entry ? "edit" : "new"}
          isAdmin={true}
          onSave={saveRestaurant}
          onCancel={() => setModal(null)}
          onDelete={modal.entry ? () => deleteRestaurant(modal.entry) : undefined}
        />
      )}
      {modal?.kind === "recipe" && (
        <RecipeForm
          initial={modal.entry}
          mode={modal.entry ? "edit" : "new"}
          onSave={saveRecipe}
          onCancel={() => setModal(null)}
          onDelete={modal.entry ? () => deleteRecipe(modal.entry) : undefined}
        />
      )}
    </>
  );
}

/* ── Restaurant list panel ── */
function RestaurantPanel({ restaurants, onNew, onEdit, onExport }) {
  return (
    <>
      <div className="ed-panel-head">
        <h2 className="ed-panel-title">Restaurants</h2>
        <div className="ed-panel-actions">
          <button className="btn-sm ghost" onClick={onExport}>Export JSON</button>
          <button className="btn-sm accent" onClick={onNew}>+ New Restaurant</button>
        </div>
      </div>
      <div className="ed-notice">
        Loaded from <code>restaurants.json</code>. Edit freely, then click <strong>Export JSON</strong> to download the updated file for git push.
      </div>
      {restaurants.length === 0 ? (
        <div className="ed-empty">No restaurants yet. Click + New Restaurant to add one.</div>
      ) : (
        <div className="ed-list">
          {restaurants.map(r => {
            const tags = Array.isArray(r.tags) ? r.tags : ["restaurant"];
            return (
              <div key={r.id} className="ed-row">
                <div className="ed-row-info">
                  <div className="ed-row-name">{r.name}</div>
                  <div className="ed-row-meta">
                    {r.cuisine || "—"}{r.address ? " · " + r.address.split(",")[0] : ""}
                    {tags.includes("restaurant") && <span className="ed-pip ed-pip-r">R</span>}
                    {tags.includes("bar")        && <span className="ed-pip ed-pip-b">B</span>}
                  </div>
                </div>
                <div className="ed-rating">★ {(r.rating || 0).toFixed(1)}</div>
                <button className="btn-sm" onClick={() => onEdit(r)}>Edit</button>
              </div>
            );
          })}
        </div>
      )}
    </>
  );
}

/* ── Recipe list panel ── */
function RecipePanel({ recipes, onNew, onEdit, onExport }) {
  return (
    <>
      <div className="ed-panel-head">
        <h2 className="ed-panel-title">Recipes</h2>
        <div className="ed-panel-actions">
          <button className="btn-sm ghost" onClick={onExport}>Export JSON</button>
          <button className="btn-sm accent" onClick={onNew}>+ New Recipe</button>
        </div>
      </div>
      <div className="ed-notice">
        Loaded from <code>recipes.json</code>. Edit freely, then click <strong>Export JSON</strong> to download the updated file for git push.
      </div>
      {recipes.length === 0 ? (
        <div className="ed-empty">No recipes yet. Click + New Recipe to add one.</div>
      ) : (
        <div className="ed-list">
          {recipes.map(r => (
            <div key={r.id} className="ed-row">
              <div className="ed-row-info">
                <div className="ed-row-name">{r.name}</div>
                <div className="ed-row-meta">
                  {r.cuisine || "—"} · {r.time || 0} min · serves {r.serves || 0}
                </div>
              </div>
              <button className="btn-sm" onClick={() => onEdit(r)}>Edit</button>
            </div>
          ))}
        </div>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(
  <ToastProvider><EditorApp /></ToastProvider>
);
</script>
</body>
</html>
