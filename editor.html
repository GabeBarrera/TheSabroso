<script type="text/babel">
/* global React, ReactDOM, SDStore */
const { useState, useEffect, useRef, useCallback, useMemo } = React;

/* ============================================================
   TOAST
   ============================================================ */
const ToastCtx = React.createContext(null);

function ToastProvider({ children }) {
  const [toasts, setToasts] = useState([]);
  const push = useCallback((message, kind = "ok", ms = 3000) => {
    const id = Math.random().toString(36).slice(2, 9);
    setToasts(t => [...t, { id, message, kind }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), ms);
  }, []);
  return (
    <ToastCtx.Provider value={push}>
      {children}
      <div className="toast-stack">
        {toasts.map(t => (
          <div key={t.id} className={`toast ${t.kind}`}>{t.message}</div>
        ))}
      </div>
    </ToastCtx.Provider>
  );
}

function useToast() { return React.useContext(ToastCtx); }

/* ============================================================
   MODAL SHELL
   ============================================================ */
function Modal({ eyebrow, title, italicTitle, onClose, children, footer, wide }) {
  useEffect(() => {
    const onEsc = e => { if (e.key === "Escape") onClose(); };
    document.addEventListener("keydown", onEsc);
    return () => document.removeEventListener("keydown", onEsc);
  }, [onClose]);

  return (
    <div className="modal-bg" onMouseDown={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal" style={wide ? { maxWidth: 900 } : {}}>
        <div className="modal-head">
          <div>
            {eyebrow && <div className="eyebrow">{eyebrow}</div>}
            <div className="h">{title}{italicTitle && <span className="it"> {italicTitle}</span>}</div>
          </div>
          <button className="modal-close" onClick={onClose} aria-label="Close">×</button>
        </div>
        <div className="modal-body">{children}</div>
        {footer && <div className="modal-foot">{footer}</div>}
      </div>
    </div>
  );
}

/* ============================================================
   STAR RATING
   ============================================================ */
function StarRating({ value, onChange, size = 28 }) {
  const [hover, setHover] = useState(null);

  const handle = (e, idx) => {
    const rect = e.currentTarget.getBoundingClientRect();
    const f = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    return Math.max(0, Math.min(5, Math.round((idx + f) * 10) / 10));
  };

  const display = hover !== null ? hover : value;

  return (
    <div className="stars-input">
      {[0,1,2,3,4].map(i => {
        const fill = Math.max(0, Math.min(1, display - i));
        return (
          <div key={i} className="star-slot" style={{ width: size, height: size }}
            onMouseMove={e => setHover(handle(e, i))}
            onMouseLeave={() => setHover(null)}
            onClick={e => onChange(handle(e, i))}>
            <div className="star-bg" style={{ fontSize: size, lineHeight: `${size}px` }}>★</div>
            <div className="star-fg" style={{ fontSize: size, lineHeight: `${size}px`, width: `${fill*100}%` }}>★</div>
          </div>
        );
      })}
      <div className="num">{value.toFixed(1)} / 5.0</div>
    </div>
  );
}

/* ============================================================
   RICH TEXT EDITOR
   ============================================================ */
function RichEditor({ value, onChange, placeholder = "Write…" }) {
  const editorRef    = useRef(null);
  const [activeMarks, setActiveMarks] = useState({});
  const [imgOpen, setImgOpen]         = useState(false);
  const [imgFilename, setImgFilename] = useState("");
  const [manifest, setManifest]       = useState([]);
  const uploadRef      = useRef(null);
  const savedRangeRef  = useRef(null);

  useEffect(() => {
    if (editorRef.current && editorRef.current.innerHTML !== (value || "")) {
      editorRef.current.innerHTML = value || "";
    }
  }, []); // mount only

  useEffect(() => {
    fetch("src/img/manifest.json", { cache: "no-store" })
      .then(r => r.ok ? r.json() : [])
      .then(data => setManifest(Array.isArray(data) ? data : (data.images || [])))
      .catch(() => setManifest([]));
  }, []);

  const saveRange = () => {
    const sel = window.getSelection();
    if (sel && sel.rangeCount > 0 && editorRef.current?.contains(sel.anchorNode)) {
      savedRangeRef.current = sel.getRangeAt(0).cloneRange();
    }
  };
  const restoreRange = () => {
    editorRef.current?.focus();
    const sel = window.getSelection();
    if (savedRangeRef.current) { sel.removeAllRanges(); sel.addRange(savedRangeRef.current); }
  };

  const exec = (cmd, arg) => {
    editorRef.current?.focus();
    document.execCommand(cmd, false, arg);
    updateActive();
    onChange(editorRef.current.innerHTML);
  };

  const insertImage = (src, alt = "") => {
    restoreRange();
    const html = `<figure class="rt-fig"><img src="${src}" alt="${alt.replace(/"/g,"&quot;")}" />${alt ? `<figcaption>${alt}</figcaption>` : ""}</figure><p><br/></p>`;
    document.execCommand("insertHTML", false, html);
    onChange(editorRef.current.innerHTML);
    setImgOpen(false);
    setImgFilename("");
  };

  const insertFromFilename = () => {
    const name = imgFilename.trim();
    if (!name) return;
    const url = name.startsWith("http") || name.startsWith("src/img/") || name.startsWith("/")
      ? name
      : `src/img/${name}`;
    insertImage(url, name.split("/").pop().replace(/\.[^.]+$/, ""));
  };

  const handleUpload = f => {
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => insertImage(reader.result, f.name.replace(/\.[^.]+$/, ""));
    reader.readAsDataURL(f);
  };

  const updateActive = () => {
    try {
      setActiveMarks({
        bold:      document.queryCommandState("bold"),
        italic:    document.queryCommandState("italic"),
        underline: document.queryCommandState("underline"),
        ul:        document.queryCommandState("insertUnorderedList"),
        ol:        document.queryCommandState("insertOrderedList"),
      });
    } catch (e) { /* no-op */ }
  };

  return (
    <div style={{ position: "relative" }}>
      <div className="rt-toolbar">
        <button type="button" className={`rt-tool bold${activeMarks.bold ? " active" : ""}`} onClick={() => exec("bold")}>B</button>
        <button type="button" className={`rt-tool italic${activeMarks.italic ? " active" : ""}`} onClick={() => exec("italic")}>I</button>
        <button type="button" className={`rt-tool under${activeMarks.underline ? " active" : ""}`} onClick={() => exec("underline")}>U</button>
        <div className="rt-divider" />
        <button type="button" className="rt-tool" onClick={() => exec("formatBlock","p")} title="Body"><span className="sz-sm">P</span></button>
        <button type="button" className="rt-tool" onClick={() => exec("formatBlock","h3")} title="Heading"><span className="sz-md">H₃</span></button>
        <button type="button" className="rt-tool" onClick={() => exec("formatBlock","h2")} title="Big Heading"><span className="sz-lg">H₂</span></button>
        <div className="rt-divider" />
        <button type="button" className={`rt-tool${activeMarks.ul ? " active" : ""}`} onClick={() => exec("insertUnorderedList")}>• —</button>
        <button type="button" className={`rt-tool${activeMarks.ol ? " active" : ""}`} onClick={() => exec("insertOrderedList")}>1.</button>
        <div className="rt-divider" />
        <button type="button" className={`rt-tool${imgOpen ? " active" : ""}`}
          onMouseDown={e => { e.preventDefault(); saveRange(); }}
          onClick={() => setImgOpen(!imgOpen)}>▢ Photo</button>
        <div className="rt-divider" />
        <button type="button" className="rt-tool" onClick={() => exec("removeFormat")} title="Clear">⌫</button>
      </div>

      {imgOpen && (
        <div className="img-picker">
          <div className="img-picker-head">
            <div className="img-picker-title">Insert photo</div>
            <button className="img-picker-close" onClick={() => setImgOpen(false)}>×</button>
          </div>
          {manifest.length > 0 && (
            <div className="img-picker-section">
              <div className="img-picker-label">From <span className="mono">src/img/</span></div>
              <div className="img-grid">
                {manifest.map(m => {
                  const file  = typeof m === "string" ? m : m.file;
                  const label = typeof m === "string" ? m : (m.label || m.file);
                  return (
                    <button key={file} type="button" className="img-thumb"
                      onClick={() => insertImage(`src/img/${file}`, label)}>
                      <img src={`src/img/${file}`} alt={label} />
                      <span className="img-thumb-name">{label}</span>
                    </button>
                  );
                })}
              </div>
            </div>
          )}
          <div className="img-picker-section">
            <div className="img-picker-label">Filename in <span className="mono">src/img/</span></div>
            <div className="img-picker-row">
              <input className="img-picker-input" placeholder="photo.jpg"
                value={imgFilename} onChange={e => setImgFilename(e.target.value)}
                onKeyDown={e => { if (e.key === "Enter") { e.preventDefault(); insertFromFilename(); } }} />
              <button type="button" className="btn primary" onClick={insertFromFilename}>Insert</button>
            </div>
          </div>
          <div className="img-picker-section">
            <div className="img-picker-label">Upload from device <span className="hint">(embedded as base64)</span></div>
            <button type="button" className="btn ghost" onClick={() => uploadRef.current?.click()}>Choose file…</button>
            <input ref={uploadRef} type="file" accept="image/*" className="hidden-file"
              onChange={e => handleUpload(e.target.files?.[0])} />
          </div>
        </div>
      )}

      <div ref={editorRef} className="rt-editor" contentEditable suppressContentEditableWarning
        data-placeholder={placeholder}
        onInput={e => onChange(e.currentTarget.innerHTML)}
        onKeyUp={() => { updateActive(); saveRange(); }}
        onMouseUp={() => { updateActive(); saveRange(); }}
        onFocus={updateActive}
        onBlur={saveRange} />
    </div>
  );
}

/* ============================================================
   FILE SYSTEM ACCESS HELPERS
   ============================================================ */
async function pickSaveFile(filename, content, mimeType = "application/json") {
  const ext = filename.split(".").pop();
  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: filename,
        types: [{ description: ext.toUpperCase() + " file", accept: { [mimeType]: ["." + ext] } }],
      });
      const writable = await handle.createWritable();
      await writable.write(content);
      await writable.close();
      return true;
    } catch (e) {
      if (e.name !== "AbortError") throw e;
      return false; // user cancelled
    }
  }
  SDStore.download(filename, content, mimeType);
  return true;
}

async function pickDirectory(files) {
  if (window.showDirectoryPicker) {
    try {
      const dir = await window.showDirectoryPicker({ mode: "readwrite" });
      for (const { name, content } of files) {
        const fh = await dir.getFileHandle(name, { create: true });
        const writable = await fh.createWritable();
        await writable.write(content);
        await writable.close();
      }
      return true;
    } catch (e) {
      if (e.name !== "AbortError") throw e;
      return false;
    }
  }
  files.forEach(({ name, content }) => SDStore.download(name, content));
  return true;
}

/* ============================================================
   RESTAURANT FORM  (identical to main app's Manage → Edit)
   ============================================================ */
const CUISINE_OPTIONS = [
  "American","Mexican","Italian","Japanese","Coastal American",
  "Modern Mexican","Brunch","Seafood","Vegetarian","Steakhouse",
  "Thai","Korean","Vietnamese","Indian","Mediterranean","French",
  "Spanish","Pizza","BBQ","Bakery","Café","Cocktail Bar",
];

function RestaurantForm({ initial, onSave, onCancel, onDelete, mode = "new", isAdmin = false }) {
  const toast = useToast();
  const [name,          setName]         = useState(initial?.name          || "");
  const [address,       setAddress]      = useState(initial?.address       || "");
  const [cuisine,       setCuisine]      = useState(initial?.cuisine       || "");
  const [customCuisine, setCustomCuisine]= useState("");
  const [rating,        setRating]       = useState(initial?.rating        ?? 4.0);
  const [description,   setDescription] = useState(initial?.description   || "");
  const [lat,           setLat]          = useState(initial?.lat           ?? 32.7157);
  const [lng,           setLng]          = useState(initial?.lng           ?? -117.1611);
  const [tags,          setTags]         = useState(initial?.tags          || ["restaurant"]);
  const [contacts,      setContacts]     = useState(initial?.contacts      || []);
  const [website,       setWebsite]      = useState(initial?.website       || "");
  const [reservationLink, setReservationLink] = useState(initial?.reservationLink || "");

  const addContact    = () => setContacts(p => [...p, { title: "", name: "" }]);
  const removeContact = i  => setContacts(p => p.filter((_,idx) => idx !== i));
  const updateContact = (i, key, val) => setContacts(p => p.map((c,idx) => idx===i ? {...c,[key]:val} : c));
  const toggleTag     = tag => setTags(p => p.includes(tag) ? p.filter(t=>t!==tag) : [...p, tag]);

  const cuisineIsCustom = cuisine === "__custom";
  const finalCuisine    = cuisineIsCustom ? customCuisine.trim() : cuisine;

  const handleSave = () => {
    if (!name.trim())   { toast("Name is required",    "warn"); return; }
    if (!address.trim()){ toast("Address is required", "warn"); return; }
    if (!finalCuisine)  { toast("Choose a cuisine",    "warn"); return; }
    onSave({
      id:          initial?.id || SDStore.newId("r"),
      name:        name.trim(),
      address:     address.trim(),
      cuisine:     finalCuisine,
      rating:      Math.round(rating * 10) / 10,
      tags:        tags.length > 0 ? tags : ["restaurant"],
      lat:         Number(lat),
      lng:         Number(lng),
      description,
      contacts:    contacts.filter(c => c.title.trim() || c.name.trim()),
      website:     website.trim() || undefined,
      reservationLink: reservationLink.trim() || undefined,
      createdAt:   initial?.createdAt || new Date().toISOString().slice(0,10),
    });
  };

  const exportOne = async fmt => {
    const slug = (name || "restaurant").replace(/\s+/g, "_").toLowerCase();
    if (fmt === "json") {
      const e = { id: initial?.id||"draft", name, address, cuisine: finalCuisine, rating, lat, lng, description };
      const saved = await pickSaveFile(`${slug}.json`, JSON.stringify(e, null, 2));
      if (saved) toast("Exported JSON", "ok");
    } else {
      const row = { name, address, cuisine: finalCuisine, rating, lat, lng, description };
      const csv = SDStore.toCSV([row], ["name","address","cuisine","rating","lat","lng","description"]);
      const saved = await pickSaveFile(`${slug}.csv`, csv, "text/csv");
      if (saved) toast("Exported CSV", "ok");
    }
  };

  return (
    <Modal
      eyebrow={mode==="new" ? "New entry" : "Edit entry"}
      title={mode==="new" ? "Log a" : "Refine"}
      italicTitle={mode==="new" ? "restaurant" : "the entry"}
      onClose={onCancel}
      wide
      footer={
        <>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            {mode==="edit" && onDelete && (
              <button className="btn danger" onClick={onDelete}>Delete</button>
            )}
            <div className="export-group">
              <span className="lbl">Export</span>
              <button onClick={() => exportOne("json")}>.json</button>
              <button onClick={() => exportOne("csv")}>.csv</button>
            </div>
          </div>
          <div className="row">
            <button className="btn ghost" onClick={onCancel}>Cancel</button>
            <button className="btn accent" onClick={handleSave}>{mode==="new" ? "Publish entry" : "Save changes"}</button>
          </div>
        </>
      }
    >
      <div className="field-row">
        <div className="field">
          <label className="field-label">Name</label>
          <input className="field-input" value={name} onChange={e=>setName(e.target.value)} placeholder="The Crab Shack" />
        </div>
        <div className="field">
          <label className="field-label">Cuisine</label>
          <select className="field-select" value={cuisine} onChange={e=>setCuisine(e.target.value)}>
            <option value="">—</option>
            {CUISINE_OPTIONS.map(c => <option key={c} value={c}>{c}</option>)}
            <option value="__custom">Custom…</option>
          </select>
          {cuisineIsCustom && (
            <input className="field-input" style={{marginTop:8}} value={customCuisine}
              onChange={e=>setCustomCuisine(e.target.value)} placeholder="e.g. Peruvian–Japanese" />
          )}
        </div>
      </div>

      <div className="field">
        <label className="field-label">Tags</label>
        <div className="tag-toggles">
          <button type="button" className={`tag-toggle${tags.includes("restaurant")?" on":""}`} onClick={()=>toggleTag("restaurant")}>
            <span className="tb-badge r">R</span> Restaurant
          </button>
          <button type="button" className={`tag-toggle${tags.includes("bar")?" on":""}`} onClick={()=>toggleTag("bar")}>
            <span className="tb-badge b">B</span> Bar
          </button>
        </div>
      </div>

      <div className="field">
        <label className="field-label">Address</label>
        <input className="field-input" value={address} onChange={e=>setAddress(e.target.value)} placeholder="1234 Coast Hwy, San Diego, CA" />
      </div>

      <div className="field-row">
        <div className="field">
          <label className="field-label">Website <span className="field-optional">optional</span></label>
          <input className="field-input" value={website} onChange={e=>setWebsite(e.target.value)} placeholder="https://restaurant.com" />
        </div>
        <div className="field">
          <label className="field-label">Reservation Link <span className="field-optional">optional</span></label>
          <input className="field-input" value={reservationLink} onChange={e=>setReservationLink(e.target.value)} placeholder="OpenTable, Tock, Resy URL…" />
        </div>
      </div>

      <div className="field-row">
        <div className="field">
          <label className="field-label">Latitude</label>
          <input className="field-input" type="number" step="0.0001" value={lat} onChange={e=>setLat(e.target.value)} />
        </div>
        <div className="field">
          <label className="field-label">Longitude</label>
          <input className="field-input" type="number" step="0.0001" value={lng} onChange={e=>setLng(e.target.value)} />
        </div>
      </div>

      <div className="field">
        <label className="field-label">Rating (drag for fractional)</label>
        <StarRating value={rating} onChange={setRating} />
      </div>

      <div className="field">
        <label className="field-label">The review</label>
        <RichEditor value={description} onChange={setDescription}
          placeholder="Walk in. First impressions. The kitchen. The order. Skip the niceties." />
      </div>

      {isAdmin && (
        <div className="field">
          <label className="field-label">Contacts</label>
          {contacts.map((c,i) => (
            <div key={i} className="contact-editor-row">
              <input className="field-input" placeholder="Title" value={c.title} onChange={e=>updateContact(i,"title",e.target.value)} />
              <input className="field-input" placeholder="Name"  value={c.name}  onChange={e=>updateContact(i,"name", e.target.value)} />
              <button type="button" className="btn ghost contact-del" onClick={()=>removeContact(i)}>✕</button>
            </div>
          ))}
          <button type="button" className="btn ghost" style={{marginTop: contacts.length>0 ? 4 : 0}} onClick={addContact}>+ Add contact</button>
        </div>
      )}
    </Modal>
  );
}

/* ============================================================
   RECIPE FORM  (identical to main app's Manage → Edit)
   ============================================================ */
function RecipeForm({ initial, onSave, onCancel, onDelete, mode = "new" }) {
  const toast = useToast();
  const [name,        setName]        = useState(initial?.name        || "");
  const [cuisine,     setCuisine]     = useState(initial?.cuisine     || "");
  const [time,        setTime]        = useState(initial?.time        || 30);
  const [serves,      setServes]      = useState(initial?.serves      || 2);
  const [tagline,     setTagline]     = useState(initial?.tagline     || "");
  const [description, setDescription]= useState(initial?.description || "");

  const handleSave = () => {
    if (!name.trim()) { toast("Name is required","warn"); return; }
    onSave({
      id:          initial?.id || SDStore.newId("rec"),
      name:        name.trim(),
      cuisine:     cuisine.trim(),
      time:        Number(time)   || 0,
      serves:      Number(serves) || 0,
      tagline:     tagline.trim(),
      description,
      createdAt:   initial?.createdAt || new Date().toISOString().slice(0,10),
    });
  };

  const exportOne = async fmt => {
    const slug = (name || "recipe").replace(/\s+/g, "_").toLowerCase();
    if (fmt === "json") {
      const e = { id: initial?.id||"draft", name, cuisine, time, serves, tagline, description };
      const saved = await pickSaveFile(`${slug}.json`, JSON.stringify(e, null, 2));
      if (saved) toast("Exported JSON", "ok");
    } else {
      const row = { name, cuisine, time, serves, tagline, description };
      const csv = SDStore.toCSV([row], ["name","cuisine","time","serves","tagline","description"]);
      const saved = await pickSaveFile(`${slug}.csv`, csv, "text/csv");
      if (saved) toast("Exported CSV", "ok");
    }
  };

  return (
    <Modal
      eyebrow={mode==="new" ? "New recipe" : "Edit recipe"}
      title={mode==="new" ? "Add a" : "Refine"}
      italicTitle={mode==="new" ? "recipe" : "the recipe"}
      onClose={onCancel}
      wide
      footer={
        <>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            {mode==="edit" && onDelete && (
              <button className="btn danger" onClick={onDelete}>Delete</button>
            )}
            <div className="export-group">
              <span className="lbl">Export</span>
              <button onClick={()=>exportOne("json")}>.json</button>
              <button onClick={()=>exportOne("csv")}>.csv</button>
            </div>
          </div>
          <div className="row">
            <button className="btn ghost" onClick={onCancel}>Cancel</button>
            <button className="btn accent" onClick={handleSave}>{mode==="new" ? "Publish recipe" : "Save changes"}</button>
          </div>
        </>
      }
    >
      <div className="field-row">
        <div className="field">
          <label className="field-label">Name</label>
          <input className="field-input" value={name} onChange={e=>setName(e.target.value)} placeholder="Fish Tacos, San Diego" />
        </div>
        <div className="field">
          <label className="field-label">Cuisine / Category</label>
          <input className="field-input" value={cuisine} onChange={e=>setCuisine(e.target.value)} placeholder="Mexican" />
        </div>
      </div>

      <div className="field-row">
        <div className="field">
          <label className="field-label">Time (minutes)</label>
          <input className="field-input" type="number" value={time} onChange={e=>setTime(e.target.value)} />
        </div>
        <div className="field">
          <label className="field-label">Serves</label>
          <input className="field-input" type="number" value={serves} onChange={e=>setServes(e.target.value)} />
        </div>
      </div>

      <div className="field">
        <label className="field-label">Tagline</label>
        <input className="field-input" value={tagline} onChange={e=>setTagline(e.target.value)} placeholder="One sentence. Make it sting." />
      </div>

      <div className="field">
        <label className="field-label">Ingredients &amp; method</label>
        <RichEditor value={description} onChange={setDescription}
          placeholder="Ingredients. Method. No filler. The reader is hungry." />
      </div>
    </Modal>
  );
}

/* ============================================================
   EDITOR APP
   ============================================================ */
const R_KEY   = "sabroso_restaurants";
const REC_KEY = "sabroso_recipes";

function EditorApp() {
  const [tab,   setTab]   = useState("restaurants");
  const [rests, setRests] = useState([]);
  const [recs,  setRecs]  = useState([]);
  const [modal, setModal] = useState(null); // { kind: "restaurant"|"recipe", entry? }
  const [loading, setLoading] = useState(true);
  const toast = useToast();

  useEffect(() => { loadData(); }, []);

  async function loadData() {
    setLoading(true);
    let rOk = false, recOk = false;
    try {
      const res = await fetch("data/restaurants.json?_=" + Date.now());
      if (!res.ok) throw new Error(res.status);
      const data = await res.json();
      setRests(data);
      localStorage.setItem(R_KEY, JSON.stringify(data));
      rOk = true;
    } catch {
      const c = localStorage.getItem(R_KEY);
      if (c) { setRests(JSON.parse(c)); rOk = true; }
    }
    try {
      const res = await fetch("data/recipes.json?_=" + Date.now());
      if (!res.ok) throw new Error(res.status);
      const data = await res.json();
      setRecs(data);
      localStorage.setItem(REC_KEY, JSON.stringify(data));
      recOk = true;
    } catch {
      const c = localStorage.getItem(REC_KEY);
      if (c) { setRecs(JSON.parse(c)); recOk = true; }
    }
    setLoading(false);
    if (rOk && recOk)        toast("Loaded from JSON files", "ok");
    else if (!rOk && !recOk) toast("Fetch failed — serve via HTTP, not file://", "warn");
    else                     toast("One file fell back to cache", "warn");
  }

  /* ── Restaurant CRUD ── */
  function saveRestaurant(entry) {
    setRests(prev => {
      const next = prev.find(r => r.id === entry.id)
        ? prev.map(r => r.id === entry.id ? entry : r)
        : [...prev, entry];
      localStorage.setItem(R_KEY, JSON.stringify(next));
      return next;
    });
    toast((modal?.entry ? "Updated" : "Added") + " · " + entry.name, "ok");
    setModal(null);
  }

  function deleteRestaurant(entry) {
    if (!confirm(`Delete "${entry.name}"? This cannot be undone.`)) return;
    setRests(prev => {
      const next = prev.filter(r => r.id !== entry.id);
      localStorage.setItem(R_KEY, JSON.stringify(next));
      return next;
    });
    toast("Deleted · " + entry.name);
    setModal(null);
  }

  /* ── Recipe CRUD ── */
  function saveRecipe(entry) {
    setRecs(prev => {
      const next = prev.find(r => r.id === entry.id)
        ? prev.map(r => r.id === entry.id ? entry : r)
        : [...prev, entry];
      localStorage.setItem(REC_KEY, JSON.stringify(next));
      return next;
    });
    toast((modal?.entry ? "Updated" : "Added") + " · " + entry.name, "ok");
    setModal(null);
  }

  function deleteRecipe(entry) {
    if (!confirm(`Delete "${entry.name}"? This cannot be undone.`)) return;
    setRecs(prev => {
      const next = prev.filter(r => r.id !== entry.id);
      localStorage.setItem(REC_KEY, JSON.stringify(next));
      return next;
    });
    toast("Deleted · " + entry.name);
    setModal(null);
  }

  /* ── Export ── */
  async function exportJSON(kind) {
    const list = kind === "restaurant" ? rests : recs;
    const filename = kind === "restaurant" ? "restaurants.json" : "recipes.json";
    const saved = await pickSaveFile(filename, JSON.stringify(list, null, 2));
    if (saved) toast("Exported " + filename, "ok");
  }

  async function exportAll() {
    const files = [
      { name: "restaurants.json", content: JSON.stringify(rests, null, 2) },
      { name: "recipes.json",     content: JSON.stringify(recs,  null, 2) },
    ];
    const saved = await pickDirectory(files);
    if (saved) toast("Exported restaurants.json + recipes.json", "ok");
  }

  return (
    <>
      <header className="ed-header">
        <div className="ed-wordmark">The <span>Sabroso</span> · Data Editor</div>
        <div className="ed-header-right">
          <a className="ed-header-btn" href="index.html">← Back to app</a>
          <button className="ed-header-btn" onClick={loadData}>↺ Reload JSON</button>
          <button className="ed-header-btn" onClick={exportAll}>Export All</button>
        </div>
      </header>

      <nav className="ed-tabs">
        <button className={`ed-tab${tab==="restaurants"?" active":""}`} onClick={() => setTab("restaurants")}>
          Restaurants <span className="ed-count">{rests.length}</span>
        </button>
        <button className={`ed-tab${tab==="recipes"?" active":""}`} onClick={() => setTab("recipes")}>
          Recipes <span className="ed-count">{recs.length}</span>
        </button>
      </nav>

      {loading ? (
        <div className="ed-loading">Loading…</div>
      ) : (
        <div className="ed-panel">
          {tab === "restaurants" && (
            <RestaurantPanel
              restaurants={rests}
              onNew={() => setModal({ kind: "restaurant" })}
              onEdit={r  => setModal({ kind: "restaurant", entry: r })}
              onExport={() => exportJSON("restaurant")}
            />
          )}
          {tab === "recipes" && (
            <RecipePanel
              recipes={recs}
              onNew={() => setModal({ kind: "recipe" })}
              onEdit={r  => setModal({ kind: "recipe", entry: r })}
              onExport={() => exportJSON("recipe")}
            />
          )}
        </div>
      )}

      {/* ── Forms: identical to main app Manage button ── */}
      {modal?.kind === "restaurant" && (
        <RestaurantForm
          initial={modal.entry}
          mode={modal.entry ? "edit" : "new"}
          isAdmin={true}
          onSave={saveRestaurant}
          onCancel={() => setModal(null)}
          onDelete={modal.entry ? () => deleteRestaurant(modal.entry) : undefined}
        />
      )}
      {modal?.kind === "recipe" && (
        <RecipeForm
          initial={modal.entry}
          mode={modal.entry ? "edit" : "new"}
          onSave={saveRecipe}
          onCancel={() => setModal(null)}
          onDelete={modal.entry ? () => deleteRecipe(modal.entry) : undefined}
        />
      )}
    </>
  );
}

/* ── Restaurant list ── */
function RestaurantPanel({ restaurants, onNew, onEdit, onExport }) {
  return (
    <>
      <div className="ed-panel-head">
        <h2 className="ed-panel-title">Restaurants</h2>
        <div className="ed-panel-actions">
          <button className="btn-sm ghost" onClick={onExport}>Export JSON</button>
          <button className="btn-sm accent" onClick={onNew}>+ New Restaurant</button>
        </div>
      </div>
      <div className="ed-notice">
        Loaded from <code>data/restaurants.json</code>. Edit freely — click <strong>Export JSON</strong> to download the updated file for git push.
      </div>
      {restaurants.length === 0 ? (
        <div className="ed-empty">No restaurants yet.</div>
      ) : (
        <div className="ed-list">
          {restaurants.map(r => {
            const tags = Array.isArray(r.tags) ? r.tags : ["restaurant"];
            return (
              <div key={r.id} className="ed-row">
                <div className="ed-row-info">
                  <div className="ed-row-name">{r.name}</div>
                  <div className="ed-row-meta">
                    {r.cuisine || "—"}{r.address ? " · " + r.address.split(",")[0] : ""}
                    {tags.includes("restaurant") && <span className="ed-pip ed-pip-r">R</span>}
                    {tags.includes("bar")        && <span className="ed-pip ed-pip-b">B</span>}
                  </div>
                </div>
                <div className="ed-rating">★ {(r.rating || 0).toFixed(1)}</div>
                <button className="btn-sm" onClick={() => onEdit(r)}>Edit</button>
              </div>
            );
          })}
        </div>
      )}
    </>
  );
}

/* ── Recipe list ── */
function RecipePanel({ recipes, onNew, onEdit, onExport }) {
  return (
    <>
      <div className="ed-panel-head">
        <h2 className="ed-panel-title">Recipes</h2>
        <div className="ed-panel-actions">
          <button className="btn-sm ghost" onClick={onExport}>Export JSON</button>
          <button className="btn-sm accent" onClick={onNew}>+ New Recipe</button>
        </div>
      </div>
      <div className="ed-notice">
        Loaded from <code>data/recipes.json</code>. Edit freely — click <strong>Export JSON</strong> to download the updated file for git push.
      </div>
      {recipes.length === 0 ? (
        <div className="ed-empty">No recipes yet.</div>
      ) : (
        <div className="ed-list">
          {recipes.map(r => (
            <div key={r.id} className="ed-row">
              <div className="ed-row-info">
                <div className="ed-row-name">{r.name}</div>
                <div className="ed-row-meta">{r.cuisine || "—"} · {r.time || 0} min · serves {r.serves || 0}</div>
              </div>
              <button className="btn-sm" onClick={() => onEdit(r)}>Edit</button>
            </div>
          ))}
        </div>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(
  <ToastProvider><EditorApp /></ToastProvider>
);
</script>
</body>
