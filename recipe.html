    /* ============================================================
       IMPORT DIALOG — validates recipe format, imports from any .json
       ============================================================ */
    function ImportDialog({ existing, onClose, onCommit }) {
      const toast = useToast();
      const [stage, setStage] = useState('pick');
      const [incoming, setIncoming] = useState([]);
      const [decisions, setDecisions] = useState({});
      const fileRef = useRef(null);

      const existingMap = useMemo(() => {
        const m = new Map();
        existing.forEach(e => { m.set(e.id, e); m.set('name:' + e.name.trim().toLowerCase(), e); });
        return m;
      }, [existing]);

      const handleFile = async f => {
        if (!f) return;
        try {
          const text = await f.text();
          let data;
          try { data = JSON.parse(text); } catch { toast('Invalid JSON file', 'warn'); return; }
          const arr = Array.isArray(data) ? data : [data];
          if (arr.length === 0) { toast('File contained no entries', 'warn'); return; }
          const invalid = arr.filter(e => {
            if (!e || typeof e !== 'object' || Array.isArray(e)) return true;
            if (!e.name || typeof e.name !== 'string' || !e.name.trim()) return true;
            if (!Array.isArray(e.ingredients)) return true;
            return false;
          });
          if (invalid.length > 0) {
            toast(`Wrong format — ${invalid.length} entr${invalid.length === 1 ? 'y' : 'ies'} missing required fields (name, ingredients[])`, 'warn');
            return;
          }
          setIncoming(arr);
          const init = {};
          arr.forEach(e => {
            const dupById  = existing.find(x => x.id === e.id);
            const dupByName = existing.find(x => x.name?.trim().toLowerCase() === (e.name || '').trim().toLowerCase());
            if (dupById || dupByName) init[e.id || ('name:' + (e.name || ''))] = 'overwrite';
          });
          setDecisions(init);
          setStage('review');
        } catch { toast('Could not read file', 'warn'); }
      };

      const dupes = useMemo(() => incoming.map(e => {
        const dupById   = existing.find(x => x.id === e.id);
        const dupByName = existing.find(x => x.name?.trim().toLowerCase() === (e.name || '').trim().toLowerCase());
        return { entry: e, dup: dupById || dupByName || null, key: e.id || ('name:' + (e.name || '')) };
      }), [incoming, existing]);

      const duplicates = dupes.filter(d => d.dup);
      const fresh = dupes.filter(d => !d.dup);

      const commit = () => {
        const out = [...existing];
        const byId = new Map(out.map(x => [x.id, x]));
        fresh.forEach(({ entry }) => {
          const e = { ...entry, id: entry.id || newId('rec') };
          if (byId.has(e.id)) e.id = newId('rec');
          byId.set(e.id, e);
          out.push(e);
        });
        duplicates.forEach(({ entry, dup, key }) => {
          if ((decisions[key] || 'overwrite') === 'overwrite') {
            const idx = out.findIndex(x => x.id === dup.id);
            out[idx] = { ...dup, ...entry, id: dup.id };
          }
        });
        onCommit(out);
        toast(`Imported · ${fresh.length} new · ${duplicates.length} duplicate${duplicates.length === 1 ? '' : 's'} reviewed`, 'ok');
      };

      return (
        <Modal
          eyebrow="Import recipes"
          title={stage === 'pick' ? 'Choose a' : 'Review the'}
          italicTitle={stage === 'pick' ? 'recipes.json file' : 'incoming recipes'}
          onClose={onClose}
          footer={
            stage === 'pick' ? (
              <div className="muted" style={{ fontFamily: 'var(--mono)', fontSize: 10, letterSpacing: '.18em', textTransform: 'uppercase' }}>
                Accepts recipes.json — array of recipes or a single recipe
              </div>
            ) : (
              <>
                <div className="muted" style={{ fontFamily: 'var(--mono)', fontSize: 10, letterSpacing: '.18em', textTransform: 'uppercase' }}>
                  {fresh.length} new · {duplicates.length} duplicate{duplicates.length === 1 ? '' : 's'}
                </div>
                <div className="row">
                  <button className="btn ghost" onClick={onClose}>Cancel</button>
                  <button className="btn accent" onClick={commit}>Commit import</button>
                </div>
              </>
            )
          }
        >
          {stage === 'pick' && (
            <div style={{ padding: '12px 0' }}>
              <div style={{ fontFamily: 'var(--serif)', fontSize: 17, color: 'var(--muted)', maxWidth: 540, marginBottom: 18 }}>
                Drop in a <em>recipes.json</em> backup file. Each entry must have a <strong>name</strong> and an <strong>ingredients</strong> array.
                Duplicates will be flagged so you can decide overwrite or discard, one by one.
              </div>
              <button className="btn primary" onClick={() => fileRef.current?.click()}>Choose recipes.json</button>
              <input ref={fileRef} type="file" accept="application/json,.json" className="hidden-file"
                onChange={e => handleFile(e.target.files?.[0])} />
            </div>
          )}

          {stage === 'review' && (
            <div>
              {fresh.length > 0 && (
                <div style={{ marginBottom: 22 }}>
                  <div className="field-label" style={{ color: 'var(--marine)' }}>{fresh.length} new entr{fresh.length === 1 ? 'y' : 'ies'} — will be added</div>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
                    {fresh.map(({ entry }, i) => (
                      <div key={i} className="dup-row" style={{ borderColor: 'var(--hairline)' }}>
                        <div>
                          <div className="dup-name">{entry.name}</div>
                          <div className="er-meta">{entry.cuisine || '—'}</div>
                        </div>
                        <div className="dup-actions">
                          <span className="mini" style={{ background: 'var(--marine)', borderColor: 'var(--marine)', color: 'var(--paper)' }}>New</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
              {duplicates.length > 0 && (
                <div>
                  <div className="field-label" style={{ color: 'var(--terracotta)' }}>
                    {duplicates.length} duplicate{duplicates.length === 1 ? '' : 's'} — choose overwrite or discard
                  </div>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
                    {duplicates.map(({ entry, dup, key }) => {
                      const choice = decisions[key] || 'overwrite';
                      return (
                        <div key={key} className="dup-row">
                          <div>
                            <div className="dup-name">{entry.name}</div>
                            <div className="er-meta">Existing: {dup.cuisine || '—'}</div>
                          </div>
                          <div className="dup-actions">
                            <button className="mini"
                              style={choice === 'overwrite' ? { background: 'var(--ink)', color: 'var(--paper)' } : {}}
                              onClick={() => setDecisions({ ...decisions, [key]: 'overwrite' })}>Overwrite</button>
                            <button className="mini danger"
                              style={choice === 'discard' ? { background: 'var(--terracotta)', borderColor: 'var(--terracotta)', color: 'var(--paper)' } : {}}
                              onClick={() => setDecisions({ ...decisions, [key]: 'discard' })}>Discard new</button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}
            </div>
          )}
        </Modal>
      );
    }

       GROCERY PANEL

    function GroceryListPanel({ items, onClose, onRemoveRecipe, onRemoveItem, onAddCustom, onClearAll }) {
      const [checked, setChecked] = useState(() => loadGroceryChecked());
      const [customInput, setCustomInput] = useState('');
      const [viewMode, setViewMode] = useState('by-recipe');

      const groups = [];
      const seen = {};
      items.forEach(item => {
        if (!seen[item.recipeId]) {
          seen[item.recipeId] = { recipeId: item.recipeId, recipeName: item.recipeName, items: [] };
          groups.push(seen[item.recipeId]);
        }
        seen[item.recipeId].items.push({ id: item.id, text: item.text, cost: item.cost });
      });

      const totals = useMemo(() => buildTotals(items), [items]);

      const totalCost = useMemo(() => {
        const costItems = items.filter(item => item.cost != null && !isNaN(item.cost));
        if (!costItems.length) return null;
        return costItems.reduce((acc, item) => acc + item.cost, 0);
      }, [items]);

      const toggleItem = key => {
        setChecked(prev => {
          const next = new Set(prev);
          next.has(key) ? next.delete(key) : next.add(key);
          saveGroceryChecked(next);
          return next;
        });
      };

      const submitCustom = () => {
        const t = customInput.trim();
        if (!t) return;
        onAddCustom(t);
        setCustomInput('');
      };

      return (
        <div className="grocery-panel">
          <div className="grocery-panel-head">
            <div>
              <div className="grocery-panel-eyebrow">Shopping</div>
              <div className="grocery-panel-title">Grocery List</div>
            </div>
            <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
              {items.length > 0 && <button className="grocery-clear-btn" onClick={onClearAll}>Clear all</button>}
              <button className="grocery-panel-close" onClick={onClose}>×</button>
            </div>
          </div>

          {items.length > 0 && (
            <div className="grocery-view-bar">
              <button className={`grocery-view-tab${viewMode === 'by-recipe' ? ' active' : ''}`} onClick={() => setViewMode('by-recipe')}>Per Recipe</button>
              <button className={`grocery-view-tab${viewMode === 'total' ? ' active' : ''}`} onClick={() => setViewMode('total')}>Totals</button>
            </div>
          )}

          <div className="grocery-panel-body">
            {items.length === 0 ? (
              <div className="grocery-empty">
                <div className="grocery-empty-line1">No ingredients yet.</div>
                <div className="grocery-empty-line2">Add from a recipe or type below</div>
              </div>
            ) : viewMode === 'total' ? (
              totals.map(({ key, displayText, sources, cost }) => {
                const checkKey = `total-${key}`;
                return (
                  <div key={key} className={`grocery-item${checked.has(checkKey) ? ' grocery-item--checked' : ''}`} onClick={() => toggleItem(checkKey)}>
                    <span className="grocery-item-bullet">—</span>
                    <div className="grocery-item-body">
                      <span className="grocery-item-text">{displayText}</span>
                      {sources.length > 1 && <span className="grocery-item-sources">{sources.join(', ')}</span>}
                    </div>
                    {cost != null && (
                      <span className="grocery-item-cost">${cost.toFixed(2)}</span>
                    )}
                  </div>
                );
              })
            ) : (
              groups.map(group => (
                <div key={group.recipeId} className="grocery-group">
                  <div className="grocery-group-head">
                    <span className="grocery-group-name">{group.recipeName}</span>
                    {group.recipeId !== '__custom__' && (
                      <button className="grocery-group-remove" onClick={() => onRemoveRecipe(group.recipeId)}>Remove</button>
                    )}
                  </div>
                  {group.items.map(({ id, text, cost }, i) => {
                    const key = `${group.recipeId}-${i}`;
                    return (
                      <div key={i} className={`grocery-item${checked.has(key) ? ' grocery-item--checked' : ''}`} onClick={() => toggleItem(key)}>
                        <span className="grocery-item-bullet">—</span>
                        <span className="grocery-item-text">{text}</span>
                        {cost != null && !isNaN(cost) && (
                          <span className="grocery-item-cost">${cost.toFixed(2)}</span>
                        )}
                        {group.recipeId === '__custom__' && (
                          <button className="grocery-item-remove" onClick={e => { e.stopPropagation(); onRemoveItem(id); }}>×</button>
                        )}
                      </div>
                    );
                  })}
                </div>
              ))
            )}
          </div>

          {totalCost !== null && (
            <div className="grocery-total-cost-row">
              <span className="grocery-total-cost-label">Total Cost</span>
              <span className="grocery-total-cost-value">${totalCost.toFixed(2)}</span>
            </div>
          )}
          <div className="grocery-add-row">
            <input className="grocery-add-input" type="text" placeholder="Add an ingredient…"
              value={customInput} onChange={e => setCustomInput(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && submitCustom()} />
            <button className="grocery-add-btn" onClick={submitCustom}>Add</button>

        if (!sortOpen) return;
        const onDoc = e => { if (!sortWrapRef.current?.contains(e.target)) setSortOpen(false); };
        document.addEventListener('mousedown', onDoc);
        return () => document.removeEventListener('mousedown', onDoc);
      }, [sortOpen]);

      const toggleFavorite = (id, e) => {
        e.stopPropagation();
        setFavorites(prev => {
          const next = new Set(prev);
          next.has(id) ? next.delete(id) : next.add(id);
          saveFavorites(next);
          return next;
        });
      };

      const toggleCuisine = cuisine => {
        setOpenCuisines(prev => {
          const next = new Set(prev);
          next.has(cuisine) ? next.delete(cuisine) : next.add(cuisine);
          return next;
        });
      };

      const [struckSteps, setStruckSteps] = useState(new Set());
      const [struckIngredients, setStruckIngredients] = useState(new Set());
      const [scale, setScale] = useState(1);
      const bodyRef = useRef(null);

      const toggleStruckIngredient = i => setStruckIngredients(prev => {
        const next = new Set(prev); next.has(i) ? next.delete(i) : next.add(i); return next;
      });

      useEffect(() => { setStruckSteps(new Set()); setStruckIngredients(new Set()); setScale(1); }, [selectedId]);

      useEffect(() => {
        if (!bodyRef.current) return;
        bodyRef.current.querySelectorAll('li').forEach((li, i) => li.classList.toggle('step-struck', struckSteps.has(i)));
      }, [struckSteps, selectedId]);

      const handleBodyClick = e => {
        const li = e.target.closest('li');
        if (!li || !bodyRef.current) return;
        const idx = [...bodyRef.current.querySelectorAll('li')].indexOf(li);
        if (idx === -1) return;
        setStruckSteps(prev => { const next = new Set(prev); next.has(idx) ? next.delete(idx) : next.add(idx); return next; });
      };

      const handleSelectRecipe = id => { setSelectedId(id); setSidebarOpen(false); };

      const SORT_BTN_LABELS  = { az: 'A–Z', za: 'Z–A', time: 'Time', serves: 'Serves', cuisine: 'Cuisine', badge: 'Type' };
      const SORT_MENU_LABELS = { az: 'Sort A → Z', za: 'Sort Z → A', time: 'By Time', serves: 'By Serving Size', cuisine: 'By Cuisine', badge: 'By Type' };

      const filtered = useMemo(() => {
        const s = q.trim().toLowerCase();
        let list = s
          ? recipes.filter(r => {
              const fields = [r.name, r.cuisine, r.tagline, r.description].filter(Boolean).join(' ').toLowerCase();
              return fields.includes(s);
            }).sort((a, b) => {
              const aName = (a.name || '').toLowerCase().includes(s);
              const bName = (b.name || '').toLowerCase().includes(s);
              return (bName ? 1 : 0) - (aName ? 1 : 0);
            })
          : [...recipes];
        if (sort === 'az') list.sort((a, b) => a.name.localeCompare(b.name));
        else if (sort === 'za') list.sort((a, b) => b.name.localeCompare(a.name));
        else if (sort === 'time') list.sort((a, b) => (a.time || 0) - (b.time || 0));
        else if (sort === 'serves') list.sort((a, b) => (a.serves || 0) - (b.serves || 0));
        return list;
      }, [q, recipes, sort]);

      const cuisineGroups = useMemo(() => {
        if (sort !== 'cuisine') return null;
        const groups = {};
        filtered.forEach(r => { const c = r.cuisine || 'Other'; if (!groups[c]) groups[c] = []; groups[c].push(r); });
        return Object.keys(groups).sort().map(c => ({ cuisine: c, recipes: groups[c] }));
      }, [sort, filtered]);

      const BADGE_ORDER = ['meat','seafood','veg','baked','dessert'];

        if (sort !== 'badge') return null;
        const groups = {};
        filtered.forEach(r => { const b = getRecipeBadge(r) || 'other'; if (!groups[b]) groups[b] = []; groups[b].push(r); });
        const order = [...BADGE_ORDER.filter(b => groups[b]), ...(groups.other ? ['other'] : [])];
        return order.map(b => ({ badge: b, label: b === 'other' ? 'Other' : BADGE_LABELS[b], recipes: groups[b] }));
      }, [sort, filtered]);

      useEffect(() => {
        if (!filtered.find(r => r.id === selectedId)) setSelectedId(filtered[0]?.id || null);
      }, [filtered]);

      const selected = recipes.find(r => r.id === selectedId);

            onClick={() => handleSelectRecipe(r.id)}
            role="button" tabIndex={0}

          >
            <div className="r-row-top">
              <div className="r-name">{r.name}</div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 6, flexShrink: 0 }}>
                {badge && <span className={`recipe-badge ${badge}`}>{BADGE_LABELS[badge]}</span>}
                <button className={`star-btn${favorites.has(r.id) ? ' on' : ''}`}
                  onClick={e => toggleFavorite(r.id, e)}
                  title={favorites.has(r.id) ? 'Remove from favorites' : 'Add to favorites'}
                  tabIndex={-1}>★</button>
              </div>
            </div>
            <div className="r-meta">{r.cuisine || '—'} · {r.time}m · serves {r.serves}</div>
          </div>
        );
      };

      const starredItems  = filtered.filter(r => favorites.has(r.id));
      const regularItems  = filtered.filter(r => !favorites.has(r.id));
      const isEmpty = filtered.length === 0;

      return (
        <div className="recipes-view">
          <div className="recipes-head">
            <div>
              <h1 className="title">The <span className="it">Recipes</span></h1>
              <div className="sub">Methods, marginalia, and the occasional shouting match</div>
            </div>
            <div className="count">
              <strong>{recipes.length}</strong>
              recipes on file
            </div>
            <ManageMenu items={manageItems} tag={isPWA ? 'PWA' : 'Browser'} />
          </div>

          <div className={`recipes-body${!sidebarOpen ? ' sidebar-closed' : ''}`}>
            <div className="recipes-sidebar">
              <div className="search-bar-row">
                <div className="search-field">
                  <span className="icon" />
                  <input placeholder="Search Keyword" value={q} onChange={e => setQ(e.target.value)} />
                </div>
                <div className="sort-wrap" ref={sortWrapRef}>
                  <button className={`sort-btn${sort ? ' active' : ''}`} onClick={() => setSortOpen(v => !v)} title="Sort recipes">
                    {sort ? SORT_BTN_LABELS[sort] : 'Sort'}<span className="sort-chev" />
                  </button>
                  {sortOpen && (
                    <div className="sort-menu">
                      <button className={!sort ? 'active' : ''} onClick={() => { setSort(null); setSortOpen(false); }}>Default</button>
                      {['az','za','time','serves','cuisine','badge'].map(s => (
                        <button key={s} className={sort === s ? 'active' : ''} onClick={() => { setSort(s); setSortOpen(false); }}>
                          {SORT_MENU_LABELS[s]}
                        </button>
                      ))}
                    </div>
                  )}
                </div>
              </div>

              <div className="recipe-list">
                {isEmpty && (
                  <div style={{ padding: '40px 8px', textAlign: 'center' }} className="muted">
                    <div style={{ fontFamily: 'var(--serif)', fontStyle: 'italic', fontSize: 18, marginBottom: 4 }}>
                      {recipes.length === 0 ? 'No recipes yet.' : 'Nothing matches.'}
                    </div>
                    <div style={{ fontFamily: 'var(--mono)', fontSize: 10, letterSpacing: '.22em', textTransform: 'uppercase' }}>
                      {recipes.length === 0 ? 'Add one via Manage → New Recipe' : 'Try another word'}
                    </div>
                  </div>
                )}

                {!isEmpty && sort === 'cuisine' ? (
                  cuisineGroups && cuisineGroups.map(({ cuisine, recipes: cRecipes }) => (
                    <div key={cuisine} className="cuisine-section">
                      <button className={`cuisine-header${openCuisines.has(cuisine) ? ' expanded' : ''}`} onClick={() => toggleCuisine(cuisine)}>
                        <span className="cuisine-label">{cuisine}</span>
                        <span className="cuisine-count">{cRecipes.length}</span>
                        <span className="cuisine-chev" />
                      </button>
                      {openCuisines.has(cuisine) && cRecipes.map(renderRecipeRow)}
                    </div>
                  ))
                ) : !isEmpty && sort === 'badge' ? (
                  badgeGroups && badgeGroups.map(({ badge, label, recipes: bRecipes }) => (
                    <div key={badge} className="cuisine-section">
                      <button className={`cuisine-header${openCuisines.has(badge) ? ' expanded' : ''}`} onClick={() => toggleCuisine(badge)}>
                        <span className="cuisine-label">{label}</span>
                        <span className="cuisine-count">{bRecipes.length}</span>
                        <span className="cuisine-chev" />
                      </button>
                      {openCuisines.has(badge) && bRecipes.map(renderRecipeRow)}
                    </div>
                  ))
                ) : (
                  !isEmpty && (
                    <>
                      {starredItems.length > 0 && (
                        <>
                          <div className="recipe-section-label">Favorites</div>
                          {starredItems.map(renderRecipeRow)}
                          {regularItems.length > 0 && <div className="recipe-list-divider" />}
                        </>
                      )}
                      {regularItems.map(renderRecipeRow)}
                    </>
                  )
                )}
              </div>
            </div>

            <div className="recipe-detail">
              <button className="sidebar-toggle-btn" onClick={() => setSidebarOpen(true)}>← Recipes</button>
              {!selected ? (
                <div className="empty">
                  <div className="glyph">Ⓡ</div>
                  <div className="ln1">No recipe selected.</div>
                  <div className="ln2">Add one via Manage → New Recipe</div>
                </div>
              ) : (
                <>
                  <div className="r-eyebrow-row">
                    <div className="r-eyebrow">
                      {selected.cuisine || 'Recipe'} · {selected.modifiedAt ? `Updated ${selected.modifiedAt}` : `Filed ${selected.createdAt}`}
                    </div>
                    <div style={{ display: 'flex', gap: 6 }}>
                      {onAddToGrocery && <AddToGroceryBtn recipe={selected} onAdd={onAddToGrocery} />}
                      {onEditRecipe && (
                        <button className="recipe-edit-btn" onClick={() => onEditRecipe(selected)} title="Edit recipe">Edit</button>
                      )}
                    </div>
                  </div>
                  <h1>{selected.name}</h1>
                  <p className="r-tagline">{selected.tagline}</p>
                  <div className="r-stats">
                    <div className="stat">
                      <div className="k">Time</div>
                      <div className="v">{selected.time} <span style={{ fontFamily: 'var(--mono)', fontSize: 11, color: 'var(--muted)' }}>min</span></div>
                    </div>
                    <div className="stat">
                      <div className="k">Serves</div>
                      <div className="v">{selected.serves ? selected.serves * scale : '—'}</div>
                    </div>
                    <div className="stat">
                      <div className="k">Category</div>
                      <div className="v">{selected.cuisine || '—'}</div>
                    </div>
                  </div>
                  <div className="r-scaler">
                    <span className="r-scaler-label">Scale</span>
                    {[1,2,3].map(n => (
                      <button key={n} className={`scaler-btn${scale === n ? ' active' : ''}`} onClick={() => setScale(n)}>×{n}</button>
                    ))}
                  </div>
                  {selected.ingredients && selected.ingredients.length > 0 && (
                    <div className="recipe-ingredients">
                      <div className="r-ing-label">Ingredients</div>
                      <div className="ingredient-list">
                        {selected.ingredients.map((ing, i) => (
                          <div key={i} className={`ingredient-item${struckIngredients.has(i) ? ' struck' : ''}${ing.notes ? ' has-notes' : ''}${ing.cost ? ' has-cost' : ''}`}
                            onClick={() => toggleStruckIngredient(i)} title="Click to cross out">
                            <span className="ing-meta">
                              <span className="ing-qty">{scaleQty(ing.qty, scale)}</span>
                              <span className="ing-unit">{ing.unit}</span>
                            </span>
                            <span className="ing-name">{ing.name}</span>
                            <span className="ing-bottom">
                              <span className="ing-notes">{ing.notes || ''}</span>
                              <span className="ing-cost">{ing.cost !== '' && ing.cost != null ? `$${parseFloat(String(ing.cost)).toFixed(2)}` : ''}</span>
                            </span>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                  <div className="recipe-body" ref={bodyRef} onClick={handleBodyClick}
                    dangerouslySetInnerHTML={{ __html: scaleHtml(selected.description || '', scale) }} />
                </>
              )}
            </div>
          </div>
        </div>
      );
    }

    /* ============================================================
       PWA INSTALL PROMPT
       ============================================================ */
    function PwaInstallPrompt() {
      const [visible, setVisible] = useState(!isPWA);
      if (!visible) return null;

      const dismiss = () => setVisible(false);

      const ua = navigator.userAgent;
      const isIos     = /iPad|iPhone|iPod/.test(ua);
      const isAndroid = /Android/.test(ua);

      let platform, steps, note;
      if (isIos) {
        platform = 'iPhone · iPad';
        steps = [
          'Open this page in Safari (not Chrome)',
          <>Tap the <strong>Share</strong> button (□↑) at the bottom of Safari</>,
          <>Scroll and tap <strong>"Add to Home Screen"</strong></>,
          <>Tap <strong>"Add"</strong> to confirm</>,
        ];
        note = 'iOS PWA install requires Safari';
      } else if (isAndroid) {
        platform = 'Android';
        steps = [
          'Open this page in Chrome',
          <>Tap the <strong>menu button (⋮)</strong> in the top-right corner</>,
          <>Tap <strong>"Add to Home Screen"</strong> or <strong>"Install App"</strong></>,
          <>Tap <strong>"Add"</strong> to confirm</>,
        ];
      } else {
        platform = 'Desktop';
        steps = [
          <>Look for the <strong>install icon (⊕)</strong> in your browser's address bar</>,
          <>Or open the <strong>browser menu (⋮ / ···)</strong></>,
          <>Select <strong>"Install"</strong> or <strong>"Add to desktop"</strong></>,
        ];
        note = 'Works in Chrome, Edge, and other Chromium browsers';
      }

      return (
        <div className="pwa-prompt" role="complementary" aria-label="Install as app">
          <div className="pwa-prompt-head">
            <div>
              <div className="pwa-prompt-eyebrow">Install · {platform}</div>
              <div className="pwa-prompt-title">Save as an App</div>
            </div>
            <button className="pwa-prompt-close" onClick={dismiss} aria-label="Dismiss">×</button>
          </div>
          <div className="pwa-prompt-body">
            <p className="pwa-prompt-desc">
              Get the full experience — recipes stay saved between visits when installed as an app.
            </p>
            <ol className="pwa-prompt-steps">
              {steps.map((step, i) => (
                <li key={i}>
                  <span className="pwa-step-num">{i + 1}</span>
                  <span>{step}</span>
                </li>
              ))}
            </ol>
            {note && <p className="pwa-prompt-note">{note}</p>}
          </div>
        </div>
      );
    }

    /* ============================================================
       ROOT APP
       ============================================================ */
    function RecipeApp() {
      const toast = useToast();
      const [recipes, setRecipes] = useState(() => loadRecipes());
      const [theme, setTheme] = useState(() => {
        try { return localStorage.getItem(THEME_KEY) || 'light'; } catch { return 'light'; }
      });
      const [modal, setModal] = useState(null); // 'new' | 'edit' | 'import'
      const [editTarget, setEditTarget] = useState(null);
      const [groceryList, setGroceryList] = useState(() => loadGroceryList());
      const [groceryOpen, setGroceryOpen] = useState(false);

      useEffect(() => { saveRecipes(recipes); }, [recipes]);

      useEffect(() => {
        document.documentElement.setAttribute('data-theme', theme);
        try { localStorage.setItem(THEME_KEY, theme); } catch {}
      }, [theme]);

      const saveRecipe = entry => {
        if (modal === 'edit') {
          setRecipes(prev => prev.map(r => r.id === entry.id
            ? { ...entry, modifiedAt: new Date().toISOString().slice(0, 10) }
            : r
          ));
          toast(`Updated · ${entry.name}`, 'ok');
        } else {
          setRecipes(prev => [...prev, entry]);
          toast(`Filed · ${entry.name}`, 'ok');
        }
        setModal(null);
        setEditTarget(null);
      };

      const deleteRecipe = id => {
        if (!confirm('Delete this recipe?')) return;
        setRecipes(prev => prev.filter(r => r.id !== id));
        setModal(null);
        setEditTarget(null);
        toast('Deleted', 'ok');
      };

      const addToGrocery = (recipe, ingredients) => {
        const newItems = ingredients.map(item => {
          const isStr = typeof item === 'string';
          return {
            id: newId('gi'),
            text: isStr ? item : item.text,
            cost: isStr ? null : (item.cost != null && !isNaN(item.cost) ? item.cost : null),
            recipeId: recipe.id,
            recipeName: recipe.name,
          };
        });
        setGroceryList(prev => {
          const next = [...prev.filter(item => item.recipeId !== recipe.id), ...newItems];
          saveGroceryList(next);
          return next;
        });
      };

      const doBackup = () => {
        download('recipes.json', JSON.stringify(recipes, null, 2));
        toast('Backed up · recipes.json', 'ok');
      };

      const manageItems = [
        { label: 'New Recipe', onClick: () => setModal('new') },
        { label: 'Import', onClick: () => setModal('import') },
        { label: 'Export', onClick: doBackup },
        ...(isPWA ? [{ label: 'Resync data', hint: 'reset', onClick: () => setModal('resync') }] : []),
      ];

      return (
        <>
          <RecipesView
            recipes={recipes}
            manageItems={manageItems}
            onEditRecipe={r => { setEditTarget(r); setModal('edit'); }}
            onAddToGrocery={addToGrocery}
          />

          {modal === 'new' && (
            <RecipeForm mode="new" onSave={saveRecipe} onCancel={() => setModal(null)} />
          )}
          {modal === 'edit' && editTarget && (
            <RecipeForm mode="edit" initial={editTarget}
              onSave={saveRecipe}
              onCancel={() => { setModal(null); setEditTarget(null); }}
              onDelete={() => deleteRecipe(editTarget.id)} />
          )}
          {modal === 'import' && (
            <ImportDialog existing={recipes} onClose={() => setModal(null)}
              onCommit={newList => { setRecipes(newList); setModal(null); }} />
          )}

          {modal === 'resync' && (
            <Modal eyebrow="Warning" title="Resync" italicTitle="Data" onClose={() => setModal(null)}
              footer={
                <div style={{ display: 'flex', gap: 10, justifyContent: 'flex-end' }}>
                  <button className="btn ghost" onClick={() => setModal(null)}>Cancel</button>
                  <button className="btn danger" onClick={() => {
                    [RECIPES_KEY, FAVS_KEY, GROCERY_KEY, GROCERY_CHECKED_KEY].forEach(k => {
                      try { localStorage.removeItem(k); } catch {}
                    });
                    window.location.reload();
                  }}>Resync &amp; Reload</button>
                </div>
              }
            >
              <p style={{ fontFamily: 'var(--serif)', fontSize: 16, lineHeight: 1.65, marginBottom: 14 }}>
                This will <strong>delete all locally saved data</strong> — every recipe and grocery list item, including anything you've added or edited.
              </p>
              <p style={{ fontFamily: 'var(--serif)', fontSize: 16, lineHeight: 1.65, marginBottom: 20 }}>
                The app will reload with a clean slate. This cannot be undone.
              </p>
              <p style={{ fontFamily: 'var(--mono)', fontSize: 10, letterSpacing: '.18em', textTransform: 'uppercase', color: 'var(--muted)' }}>
                Back up your recipes first via Manage → Export
              </p>
            </Modal>
          )}

          {groceryOpen && (
            <GroceryListPanel
              items={groceryList}
              onClose={() => setGroceryOpen(false)}
              onRemoveRecipe={rid => {
                setGroceryList(prev => { const next = prev.filter(i => i.recipeId !== rid); saveGroceryList(next); return next; });
              }}
              onRemoveItem={id => {
                setGroceryList(prev => { const next = prev.filter(i => i.id !== id); saveGroceryList(next); return next; });
              }}
              onAddCustom={text => {
                const item = { id: newId('gi'), text, recipeId: '__custom__', recipeName: 'Custom' };
                setGroceryList(prev => { const next = [...prev, item]; saveGroceryList(next); return next; });
              }}
              onClearAll={() => {
                setGroceryList([]);
                saveGroceryList([]);
                saveGroceryChecked(new Set());
              }}
            />
          )}

          {/* Grocery toggle */}
          <button className={`grocery-toggle${groceryOpen ? ' active' : ''}`}
            onClick={() => setGroceryOpen(v => !v)} title="Grocery list">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
              <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/>
              <rect x="9" y="3" width="6" height="4" rx="1"/>
              <line x1="9" y1="12" x2="15" y2="12"/>
              <line x1="9" y1="16" x2="13" y2="16"/>
            </svg>
          </button>

          {/* Theme toggle */}
          <button className="theme-toggle" onClick={() => setTheme(t => t === 'light' ? 'dark' : 'light')}
            title={theme === 'light' ? 'Switch to dark mode' : 'Switch to light mode'}>
            {theme === 'light' ? (
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
              </svg>
            ) : (
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round">
                <circle cx="12" cy="12" r="5"/>
                <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
              </svg>
            )}
          </button>

          <PwaInstallPrompt />
        </>
      );
    }

    /* ============================================================
       MOUNT
       ============================================================ */
    function App() {
      return (
        <ToastProvider>
          <RecipeApp />
        </ToastProvider>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
